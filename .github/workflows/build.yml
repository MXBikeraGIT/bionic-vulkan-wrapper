name: Build Bionic Vulkan Wrapper Driver

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System and Python Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            bison \
            flex \
            pkg-config \
            glslang-tools \
            gettext
          python -m pip install --upgrade pip
          pip install "meson>=1.1.0" mako PyYAML

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: 'r25c'

      - name: Generate Android Cross-Compilation File
        run: |
          NDK_PATH="${ANDROID_NDK_HOME:-${ANDROID_NDK_ROOT:-$ANDROID_NDK}}"
          echo "Using NDK path: $NDK_PATH"
          cat << EOF > android-aarch64.cross
          [binaries]
          c = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang'
          cpp = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang++'
          ar = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = 'false'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'aarch64'
          endian = 'little'
          EOF

      - name: Configure Meson Build
        run: |
          meson setup build \
            --cross-file android-aarch64.cross \
            --layout=mirror \
            -Dbuildtype=release \
            -Dvulkan-drivers=wrapper \
            -Dgallium-drivers= \
            -Dplatforms=android \
            -Dplatform-sdk-version=30 \
            -Dandroid-stub=true \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dtools=[]

      - name: Compile Driver with Ninja
        run: |
          ninja -C build

      - name: Upload Built Driver Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-wrapper-driver
          path: build/src/vulkan/wrapper/libvulkan_wrapper.so
