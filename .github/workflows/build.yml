name: Build Bionic-Wrapper-Mali

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-wrapper:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Multi-Arch APT and Repositories
        run: |
          sudo dpkg --add-architecture arm64
          
          # Restrict existing x86 repositories (http and https) to amd64 and i386
          sudo sed -i -E 's/deb (http|https):\/\//deb [arch=amd64,i386] \1:\/\//g' /etc/apt/sources.list
          sudo sed -i -E 's/deb (http|https):\/\//deb [arch=amd64,i386] \1:\/\//g' /etc/apt/sources.list.d/*.list 2>/dev/null || true
          
          # Add Ubuntu ports for arm64 target libraries
          cat <<EOF | sudo tee /etc/apt/sources.list.d/arm64-ports.list
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
          
          sudo apt-get update

      - name: Install Build Tools & Target ARM64 Libraries
        run: |
          sudo apt-get install -y \
            bison \
            flex \
            gettext \
            glslang-tools \
            pkg-config \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libspirv-tools-dev:arm64 \
            libdrm-dev:arm64

      - name: Install Meson, Ninja, and Code Generators
        run: |
          python -m pip install --upgrade pip
          pip install meson ninja mako pyyaml

      - name: Generate Meson Cross-File
        run: |
          cat << 'EOF' > aarch64-cross.txt
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkg-config = 'aarch64-linux-gnu-pkg-config'

          [built-in options]
          c_args = ['-I/usr/include/aarch64-linux-gnu']
          cpp_args = ['-I/usr/include/aarch64-linux-gnu']
          c_link_args = ['-L/usr/lib/aarch64-linux-gnu']
          cpp_link_args = ['-L/usr/lib/aarch64-linux-gnu']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

      - name: Configure Meson Build
        run: |
          meson setup build \
            --cross-file aarch64-cross.txt \
            --buildtype=release \
            -Dvulkan-drivers=wrapper \
            -Dgallium-drivers="" \
            -Dplatforms=android \
            -Dplatform-sdk-version=30 \
            -Dbuild-tests=false

      - name: Compile Target
        run: |
          ninja -C build

      - name: Upload Driver Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-wrapper-mali
          path: |
            build/src/vulkan/wrapper/*.so
            build/src/vulkan/wrapper/libvulkan_wrapper.so
