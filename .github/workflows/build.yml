name: Wrapper with Spir‑v Patching

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: MXBikeraGIT/bionic-vulkan-wrapper
          ref: wrapper
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip meson ninja-build pkg-config libdrm-dev libelf-dev glslang-tools
          pip3 install mako

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Create cross compilation file
        run: |
          NDK=${{ steps.ndk.outputs.ndk-path }}
          cat > android-aarch64.txt << EOF
          [binaries]
          c = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang'
          cpp = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++'
          ar = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

      - name: Find and patch the real vkCreateShaderModule function
        run: |
          # The function resides in one of the wrapper's source files
          cd src/vulkan/wrapper
          TARGET_FILE=$(grep -l "vkCreateShaderModule" *.cpp | head -1)
          if [ -z "$TARGET_FILE" ]; then
            echo "ERROR: vkCreateShaderModule not found"
            exit 1
          fi
          echo "Patching file: $TARGET_FILE"

          # Add a simple log at the start of the function
          sed -i '/^VkResult VKAPI_CALL vkCreateShaderModule/,/^{/a\
              fprintf(stderr, "[Wrapper] vkCreateShaderModule called, code size = %zu\\n", pCreateInfo->codeSize);' "$TARGET_FILE"

      - name: Configure and build wrapper driver
        run: |
          export ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }}
          meson setup build \
            --cross-file android-aarch64.txt \
            -Dplatforms=android \
            -Dvulkan-drivers=wrapper \
            -Dgallium-drivers= \
            -Dandroid-stub=true \
            -Dbuildtype=release \
            -Dglx=disabled \
            -Degl=disabled
          ninja -C build

      - name: Copy output library
        run: |
          mkdir -p artifacts
          cp build/src/vulkan/wrapper/libvulkan_wrapper.so artifacts/
          ls -la artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-spirv-patcher
          path: artifacts/libvulkan_wrapper.so
