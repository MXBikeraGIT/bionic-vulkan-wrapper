name: Build Vulkan Wrapper (NDK, no Termux)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout leegao wrapper source (Mesa)
        uses: actions/checkout@v4
        with:
          repository: leegao/bionic-vulkan-wrapper
          path: mesa-src
          ref: wrapper

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip meson ninja-build pkg-config libdrm-dev libelf-dev
          pip3 install mako

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Create cross compilation file
        run: |
          NDK=${{ steps.ndk.outputs.ndk-path }}
          cat > android-aarch64.txt << EOF
          [binaries]
          c = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang'
          cpp = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++'
          ar = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

      - name: Patch zink_bo.c to remove DRM dependency
        run: |
          cd mesa-src/src/gallium/drivers/zink
          # Wrap the DRM include
          sed -i '/#include <xf86drm.h>/i#ifndef ANDROID' zink_bo.c
          sed -i '/#include <xf86drm.h>/a#endif' zink_bo.c
          # Stub out the function that uses drm_gem_close
          sed -i '/^zink_bo_get_handle/,/^}/ {
            /^{/a\
          #ifndef ANDROID
            /^}/i\
          #endif
          }' zink_bo.c

      - name: Configure and build wrapper driver
        run: |
          export ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }}
          export CFLAGS="-DETIME=ETIMEDOUT -DANDROID"
          export CXXFLAGS="-DETIME=ETIMEDOUT -DANDROID"
          cd mesa-src
          meson setup build \
            --cross-file ../android-aarch64.txt \
            -Dplatforms=android \
            -Dvulkan-drivers=wrapper \
            -Dgallium-drivers= \
            -Dandroid-stub=true \
            -Dbuildtype=release \
            -Dglx=disabled \
            -Degl=disabled
          ninja -C build

      - name: Copy library
        run: |
          mkdir -p artifacts
          cp mesa-src/build/src/vulkan/wrapper/libvulkan_wrapper.so artifacts/libvulkan_wrapper.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-wrapper-ndk
          path: artifacts/libvulkan_wrapper.so
