name: Wrapper with Spir-v Patching

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: MXBikeraGIT/bionic-vulkan-wrapper
          ref: wrapper
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip meson ninja-build pkg-config libdrm-dev libelf-dev glslang-tools
          pip3 install mako

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Create cross compilation file
        run: |
          NDK=${{ steps.ndk.outputs.ndk-path }}
          cat > android-aarch64.txt << EOF
          [binaries]
          c = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang'
          cpp = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++'
          ar = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

      - name: Modify spirv_edit.cpp to strip OpDecorate in the Mali pass
        run: |
          cd src/vulkan/wrapper
          # Insert a function to strip OpDecorate at the beginning of the file
          cat > strip_decorate.h << 'EOF'
          #include <vector>
          static inline std::vector<uint32_t> strip_op_decorate(const uint32_t* code, size_t word_count) {
              std::vector<uint32_t> result;
              if (word_count < 5) return result;
              result.insert(result.end(), code, code + 5);
              size_t i = 5;
              while (i < word_count) {
                  uint16_t opcode = code[i] & 0xFFFF;
                  uint16_t word_len = code[i] >> 16;
                  if (opcode != 51) { // 51 = OpDecorate
                      result.insert(result.end(), code + i, code + i + word_len);
                  }
                  i += word_len;
              }
              return result;
          }
          EOF
          # Modify the existing function `lower_eliminate_clip_distance` to first strip OpDecorate
          # We'll create a copy of the function with a new name and replace the original.
          # But easier: we can patch the function to call strip_op_decorate on the input and then run the optimizer on the stripped binary.
          # However, the function expects a SpirvCode* out. We'll modify it to use the stripped version.
          # This is complex; instead, we'll add a new function that does both and then hook it later.
          # For now, let's just add a log to confirm the function is called.
          sed -i '/^int lower_eliminate_clip_distance/i\
          #include "strip_decorate.h"' spirv_edit.cpp
          sed -i '/^int lower_eliminate_clip_distance/,/^}/ {
              /^int lower_eliminate_clip_distance/ {
                  a\
                  WLOG("lower_eliminate_clip_distance called");
              }
          }' spirv_edit.cpp

      - name: Configure and build wrapper driver
        run: |
          export ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }}
          meson setup build \
            --cross-file android-aarch64.txt \
            -Dplatforms=android \
            -Dvulkan-drivers=wrapper \
            -Dgallium-drivers= \
            -Dandroid-stub=true \
            -Dbuildtype=release \
            -Dglx=disabled \
            -Degl=disabled
          ninja -C build

      - name: Copy output library
        run: |
          mkdir -p artifacts
          cp build/src/vulkan/wrapper/libvulkan_wrapper.so artifacts/
          ls -la artifacts/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-spirv-patcher
          path: artifacts/libvulkan_wrapper.so
