name: Build Vulkan Wrapper (Termux style)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout termux-packages
        uses: actions/checkout@v4
        with:
          repository: termux/termux-packages
          path: termux-packages

      - name: Checkout leegao's vulkan_wrapper package definition
        uses: actions/checkout@v4
        with:
          repository: leegao/vulkan_wrapper_termux-packages
          path: vulkan_wrapper_termux-packages
          ref: dev/wrapper

      - name: List contents for debugging
        run: |
          echo "Contents of vulkan_wrapper_termux-packages:"
          ls -laR vulkan_wrapper_termux-packages/

      - name: Setup package directory
        run: |
          mkdir -p termux-packages/packages/vulkan_wrapper
          # If there is a subdirectory containing build.sh, copy it
          if [ -f vulkan_wrapper_termux-packages/build.sh ]; then
            cp -r vulkan_wrapper_termux-packages/* termux-packages/packages/vulkan_wrapper/
          else
            # Look for build.sh in subdirectories
            BUILD_DIR=$(find vulkan_wrapper_termux-packages -name "build.sh" -exec dirname {} \; | head -1)
            if [ -n "$BUILD_DIR" ]; then
              cp -r $BUILD_DIR/* termux-packages/packages/vulkan_wrapper/
            else
              echo "build.sh not found, exiting"
              exit 1
            fi
          fi

      - name: Build with Termux Docker
        run: |
          cd termux-packages
          docker run --rm -v $PWD:/home/builder/termux-packages termux/package-builder /bin/bash -c "
            ./build-package.sh -I vulkan_wrapper
          "

      - name: Extract libvulkan_wrapper.so
        run: |
          DEB=$(find termux-packages/debs -name "vulkan_wrapper*.deb" | head -1)
          if [ -z "$DEB" ]; then
            echo "No .deb found; searching for .so directly"
            find termux-packages -name "libvulkan_wrapper.so" -exec cp {} artifacts/ \;
          else
            mkdir -p extracted
            dpkg-deb -x "$DEB" extracted/
            mkdir -p artifacts
            find extracted -name "libvulkan_wrapper.so" -exec cp {} artifacts/ \;
          fi

      - name: Package as .wcp
        run: |
          mkdir -p package
          cp artifacts/libvulkan_wrapper.so package/
          cat > package/profile.json << 'EOF'
          {
            "type": "Vulkan",
            "versionName": "1.0",
            "versionCode": 1,
            "description": "Vulkan wrapper for Mali GPUs",
            "files": [
              {
                "source": "libvulkan_wrapper.so",
                "target": "${system32}/libvulkan_wrapper.so"
              }
            ]
          }
          EOF
          cd package
          tar -cf ../vulkan_wrapper.wcp .
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-wrapper
          path: vulkan_wrapper.wcp
