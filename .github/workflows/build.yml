name: Build wrapper Vulkan driver (all deps)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          repository: MXBikeraGIT/bionic-vulkan-wrapper
          ref: wrapper
          fetch-depth: 1

      - name: Install all possible build dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3-pip meson ninja-build \
            pkg-config libelf-dev libdrm-dev \
            libx11-dev libxext-dev libxrandr-dev libxrender-dev \
            libxcb1-dev libx11-xcb-dev libxcb-glx0-dev libxcb-randr0-dev \
            libxcb-shm0-dev libxcb-dri2-0-dev libxcb-dri3-dev \
            libxcb-present-dev libxcb-sync-dev libxcb-util0-dev \
            libxshmfence-dev libxxf86vm-dev libxinerama-dev libxcursor-dev \
            libwayland-dev wayland-protocols \
            libgl1-mesa-dev libglu1-mesa-dev \
            libvulkan-dev glslang-tools \
            libunwind-dev libzstd-dev liblz4-dev libssl-dev \
            libomxil-bellagio-dev libva-dev libvdpau-dev \
            libclc-18 libclc-18-dev llvm-18-dev \
            flex bison \
            libexpat1-dev libxml2-dev \
            libglvnd-dev \
            libsensors-dev libpciaccess-dev
          pip3 install mako

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Create cross compilation file
        run: |
          NDK=${{ steps.ndk.outputs.ndk-path }}
          cat > android-aarch64.txt << 'EOF'
          [binaries]
          c = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang'
          cpp = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++'
          ar = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

      - name: Configure and build wrapper driver
        run: |
          export ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }}
          meson setup build \
            --cross-file android-aarch64.txt \
            -Dplatforms=android \
            -Dvulkan-drivers=wrapper \
            -Dgallium-drivers= \
            -Dandroid-stub=true \
            -Dbuildtype=release \
            -Dglx=disabled \
            -Degl=disabled \
            -Dllvm=disabled \
            -Dshared-glapi=disabled
          ninja -C build

      - name: Copy output library
        run: |
          mkdir -p artifacts
          if [ -f build/src/vulkan/wrapper/libvulkan_wrapper.so ]; then
            cp build/src/vulkan/wrapper/libvulkan_wrapper.so artifacts/
          else
            find build -name "libvulkan_wrapper.so" -exec cp {} artifacts/ \;
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan-wrapper
          path: artifacts/libvulkan_wrapper.so
