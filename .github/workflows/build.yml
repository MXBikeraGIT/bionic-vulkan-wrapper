name: Build Vulkan Wrapper (Mali)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (your fork or leegao's)
        uses: actions/checkout@v4
        with:
          repository: leegao/bionic-vulkan-wrapper   # change to your fork URL if needed
          ref: wrapper                                # branch with Mesa source
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip meson ninja-build cmake
          pip3 install mako

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Apply Mali workarounds to wrapper driver
        run: |
          cd src/vulkan/wrapper
          # The file that handles physical device properties (likely wrapper_physical_device.c)
          # We'll add a small function and hook it into the init routine.
          cat >> wrapper_physical_device.c << 'EOF'
          // Mali workarounds added
          #include <string.h>
          static void mali_workarounds(struct wrapper_physical_device *phys_dev) {
              if (strstr(phys_dev->device_props.deviceName, "Mali")) {
                  // Clamp maxStorageBufferRange to 128 MB
                  if (phys_dev->device_props.limits.maxStorageBufferRange > 128 * 1024 * 1024)
                      phys_dev->device_props.limits.maxStorageBufferRange = 128 * 1024 * 1024;
                  // Force shaderStorageBufferArrayDynamicIndexing support
                  phys_dev->features.features.shaderStorageBufferArrayDynamicIndexing = VK_TRUE;
              }
          }
          EOF
          # Insert a call to mali_workarounds at the end of the initialisation function
          sed -i '/^VkResult wrapper_physical_device_init/i\
          extern void mali_workarounds(struct wrapper_physical_device *phys_dev);' wrapper_physical_device.c
          sed -i '/return VK_SUCCESS;/i\
              mali_workarounds(phys_dev);' wrapper_physical_device.c

      - name: Build wrapper driver
        run: |
          export ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }}
          meson setup build \
            --cross-file cross_files/android-aarch64 \
            -Dplatforms=android \
            -Dvulkan-drivers=wrapper \
            -Dgallium-drivers= \
            -Dandroid-stub=true \
            -Dbuildtype=release
          ninja -C build

      - name: Copy and upload driver
        run: |
          mkdir -p artifacts
          cp build/src/vulkan/wrapper/libvulkan_wrapper.so artifacts/
          # Also attempt to copy if located elsewhere (fallback)
          if [ ! -f artifacts/libvulkan_wrapper.so ]; then
            find build -name "libvulkan_wrapper.so" -exec cp {} artifacts/ \;
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper
          path: artifacts/libvulkan_wrapper.so
