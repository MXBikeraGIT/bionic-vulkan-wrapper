name: Build Wrapper with SPIRV-Tools (shader patching)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wrapper source
        uses: actions/checkout@v4
        with:
          repository: MXBikeraGIT/bionic-vulkan-wrapper
          ref: wrapper
          fetch-depth: 1

      - name: Install build tools
        run: |
          sudo apt update
          sudo apt install -y python3-pip meson ninja-build cmake
          pip3 install mako

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Build SPIRV-Tools for Android
        run: |
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Tools.git
          git clone --depth 1 https://github.com/KhronosGroup/SPIRV-Headers.git
          mkdir SPIRV-Tools/build
          cd SPIRV-Tools/build
          NDK=${{ steps.ndk.outputs.ndk-path }}
          cmake -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
                -DCMAKE_BUILD_TYPE=Release \
                -DSPIRV-Headers_SOURCE_DIR=../SPIRV-Headers \
                -DBUILD_SHARED_LIBS=ON \
                -DSPIRV_SKIP_TESTS=ON \
                -DSPIRV_SKIP_EXECUTABLES=ON ..
          make -j$(nproc)
          mkdir -p ${{ github.workspace }}/spirv-tools-install/lib
          cp lib/libSPIRV-Tools.so ${{ github.workspace }}/spirv-tools-install/lib/

      - name: Patch wrapper to include SPIRV-Tools and add shader logging
        run: |
          cd src/vulkan/wrapper
          # Add a simple logging stub inside WrappedCreateShaderModule
          cat >> shader_utils.cpp << 'EOF'
          #include <stdio.h>
          #include <spirv-tools/libspirv.h>
          extern "C" {
              static void log_shader(const uint32_t* code, size_t words) {
                  printf("[Wrapper] Shader module size: %zu words\n", words);
                  // Example: dump first few words
                  for (size_t i = 0; i < (words > 8 ? 8 : words); ++i) {
                      printf("  word[%zu]: 0x%08x\n", i, code[i]);
                  }
              }
          }
          EOF
          # Inject the logging call at the beginning of WrappedCreateShaderModule
          sed -i '/^VkResult WrappedCreateShaderModule/,/^{/a\
              log_shader(pCreateInfo->pCode, pCreateInfo->codeSize / sizeof(uint32_t));' shader_utils.cpp
          echo "Added shader logging stub"

      - name: Modify meson.build to link SPIRV-Tools
        run: |
          cd src/vulkan/wrapper
          # Add dependency on SPIRV-Tools in meson.build (adjust path)
          cat >> meson.build << 'EOF'
          # Add SPIRV-Tools dependency
          spirv_tools_inc = include_directories('${{ github.workspace }}/SPIRV-Tools/include')
          spirv_tools_lib = declare_dependency(
              include_directories : spirv_tools_inc,
              link_args : ['-L${{ github.workspace }}/spirv-tools-install/lib', '-lSPIRV-Tools']
          )
          # Append to existing dependencies
          all_deps += [spirv_tools_lib]
          EOF

      - name: Create cross compilation file
        run: |
          NDK=${{ steps.ndk.outputs.ndk-path }}
          cat > android-aarch64.txt << EOF
          [binaries]
          c = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang'
          cpp = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++'
          ar = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

      - name: Build wrapper driver
        run: |
          export ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }}
          meson setup build \
            --cross-file android-aarch64.txt \
            -Dplatforms=android \
            -Dvulkan-drivers=wrapper \
            -Dgallium-drivers= \
            -Dandroid-stub=true \
            -Dbuildtype=release \
            -Dglx=disabled \
            -Degl=disabled
          ninja -C build

      - name: Copy output library
        run: |
          mkdir -p artifacts
          if [ -f build/src/vulkan/wrapper/libvulkan_wrapper.so ]; then
            cp build/src/vulkan/wrapper/libvulkan_wrapper.so artifacts/
          else
            find build -name "libvulkan_wrapper.so" -exec cp {} artifacts/ \;
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-wrapper-spirv-tools
          path: artifacts/libvulkan_wrapper.so
