name: Build Vulkan Wrapper (Mali)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4
        with:
          repository: MXBikeraGIT/bionic-vulkan-wrapper   # your fork
          ref: wrapper
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip meson ninja-build cmake
          pip3 install mako

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Apply Mali workarounds
        run: |
          cd src/vulkan/wrapper
          # Patch the file that defines the physical device properties
          # We'll add a small function and hook it into the init routine
          cat >> wrapper_physical_device.c << 'EOF'
          // Mali workarounds
          #include <string.h>
          static void mali_workarounds(struct wrapper_physical_device *phys_dev) {
              if (strstr(phys_dev->device_props.deviceName, "Mali")) {
                  if (phys_dev->device_props.limits.maxStorageBufferRange > 128 * 1024 * 1024)
                      phys_dev->device_props.limits.maxStorageBufferRange = 128 * 1024 * 1024;
                  phys_dev->features.features.shaderStorageBufferArrayDynamicIndexing = VK_TRUE;
              }
          }
          EOF
          # Insert a call before the function returns
          sed -i '/return VK_SUCCESS;/i\
              mali_workarounds(phys_dev);' wrapper_physical_device.c

      - name: Build wrapper driver
        run: |
          export ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }}
          meson setup build \
            --cross-file android-aarch64 \
            -Dplatforms=android \
            -Dvulkan-drivers=wrapper \
            -Dgallium-drivers= \
            -Dandroid-stub=true \
            -Dbuildtype=release
          ninja -C build

      - name: Copy artifact
        run: |
          mkdir -p artifacts
          # Find the built library (usually in build/src/vulkan/wrapper/libvulkan_wrapper.so)
          if [ -f build/src/vulkan/wrapper/libvulkan_wrapper.so ]; then
            cp build/src/vulkan/wrapper/libvulkan_wrapper.so artifacts/
          else
            find build -name "libvulkan_wrapper.so" -exec cp {} artifacts/ \;
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper
          path: artifacts/libvulkan_wrapper.so
