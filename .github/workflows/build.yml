name: Build leegao wrapper (Mali workarounds)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository (manual, to avoid checkout issues)
        run: |
          git clone --depth 1 --branch wrapper https://github.com/leegao/bionic-vulkan-wrapper.git mesa-src
          # Optionally, if you want to use your own fork, replace URL with your fork's URL
          # git clone --depth 1 --branch wrapper https://github.com/MXBikeraGIT/bionic-vulkan-wrapper.git mesa-src

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip meson ninja-build cmake
          pip3 install mako

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c

      - name: Apply Mali workarounds
        run: |
          cd mesa-src/src/vulkan/wrap
          cat > mali_workarounds.patch << 'EOF'
          --- a/src/vulkan/wrap/wrap_physical_device.c
          +++ b/src/vulkan/wrap/wrap_physical_device.c
          @@ -123,6 +123,16 @@ VkResult wrap_physical_device_init(struct wrap_physical_device *phys_dev,
               if (res != VK_SUCCESS)
                   return res;
           
          +    // Mali workarounds
          +    if (strstr(phys_dev->device_props.deviceName, "Mali")) {
          +        if (phys_dev->device_props.limits.maxStorageBufferRange > 128 * 1024 * 1024)
          +            phys_dev->device_props.limits.maxStorageBufferRange = 128 * 1024 * 1024;
          +        phys_dev->features.features.shaderStorageBufferArrayDynamicIndexing = VK_TRUE;
          +    }
          +
               return VK_SUCCESS;
           }
          EOF
          patch -p1 < mali_workarounds.patch

      - name: Configure and build
        run: |
          cd mesa-src
          export ANDROID_NDK=${{ steps.ndk.outputs.ndk-path }}
          meson setup build \
            --cross-file cross_files/android-aarch64 \
            -Dplatforms=android \
            -Dvulkan-drivers=wrap \
            -Dgallium-drivers= \
            -Dandroid-stub=true \
            -Dbuildtype=release
          ninja -C build

      - name: Copy artifact
        run: |
          mkdir -p artifacts
          cp mesa-src/build/src/vulkan/wrap/libvulkan_wrap.so artifacts/libvulkan_wrapper.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan_wrapper
          path: artifacts/libvulkan_wrapper.so
