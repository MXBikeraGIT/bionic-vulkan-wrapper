name: Build Bionic-Wrapper-Mali

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-wrapper:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Configure Multi-Arch APT and Repositories
        run: |
          sudo dpkg --add-architecture arm64
          
          # Remove runner DEB822 sources that cause 404 errors on arm64 lookups
          sudo rm -f /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list
          
          # Write strict dual-arch configuration
          cat <<EOF | sudo tee /etc/apt/sources.list
          deb [arch=amd64] http://azure.archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb [arch=amd64] http://azure.archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb [arch=amd64] http://azure.archive.ubuntu.com/ubuntu jammy-backports main restricted universe multiverse
          deb [arch=amd64] http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse

          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-backports main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-security main restricted universe multiverse
          EOF
          
          sudo apt-get update

      - name: Install Build Tools & Target ARM64 Libraries
        run: |
          sudo apt-get install -y \
            bison \
            flex \
            gettext \
            glslang-tools \
            spirv-tools \
            spirv-headers \
            pkg-config \
            clang \
            lld \
            llvm \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu \
            libdrm-dev:arm64 \
            zlib1g-dev:arm64 \
            libexpat1-dev:arm64

          # Extract arm64 spirv-tools static libraries without APT file collisions
          mkdir -p /tmp/arm64-debs
          cd /tmp/arm64-debs
          apt-get download spirv-tools:arm64
          sudo dpkg-deb -x spirv-tools_*.deb /

      - name: Install Meson, Ninja, and Code Generators
        run: |
          python -m pip install --upgrade pip
          pip install meson ninja mako pyyaml

      - name: Generate Meson Cross-File
        run: |
          cat << 'EOF' > aarch64-cross.txt
          [binaries]
          c = ['clang', '--target=aarch64-linux-gnu']
          cpp = ['clang++', '--target=aarch64-linux-gnu']
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkg-config = 'pkg-config'

          [properties]
          pkg_config_libdir = ['/usr/lib/aarch64-linux-gnu/pkgconfig', '/usr/share/pkgconfig']

          [built-in options]
          c_args = ['-I/usr/include/aarch64-linux-gnu', '-include', 'stdint.h', '-D__INTRODUCED_IN(x)=', '-D__INTRODUCED_IN_64(x)=', '-D__INTRODUCED_IN_32(x)=', '-DSYS_memfd_create=279', '-DSYS_getrandom=278', '-DKCMP_FILE=0', '-DNULL=((void*)0)', '-Wno-error=incompatible-pointer-types', '-Wno-incompatible-pointer-types']
          cpp_args = ['-I/usr/include/aarch64-linux-gnu', '-include', 'stdint.h', '-D__INTRODUCED_IN(x)=', '-D__INTRODUCED_IN_64(x)=', '-D__INTRODUCED_IN_32(x)=', '-DSYS_memfd_create=279', '-DSYS_getrandom=278', '-DKCMP_FILE=0', '-DNULL=nullptr', '-Wno-error=incompatible-pointer-types', '-Wno-incompatible-pointer-types']
          c_link_args = ['-L/usr/lib/aarch64-linux-gnu', '-L/usr/aarch64-linux-gnu/lib', '-B/usr/aarch64-linux-gnu/lib', '-B/usr/lib/aarch64-linux-gnu', '-fuse-ld=lld']
          cpp_link_args = ['-L/usr/lib/aarch64-linux-gnu', '-L/usr/aarch64-linux-gnu/lib', '-B/usr/aarch64-linux-gnu/lib', '-B/usr/lib/aarch64-linux-gnu', '-fuse-ld=lld']

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

      - name: Configure Meson Build
        run: |
          meson setup build \
            --cross-file aarch64-cross.txt \
            --buildtype=release \
            -Dvulkan-drivers=wrapper \
            -Dgallium-drivers="" \
            -Dplatforms=android \
            -Dplatform-sdk-version=30 \
            -Ddri3=disabled \
            -Dbuild-tests=false

      - name: Compile Target
        run: |
          ninja -C build

      - name: Upload Driver Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-wrapper-mali
          path: |
            build/src/vulkan/wrapper/*.so
            build/src/vulkan/wrapper/libvulkan_wrapper.so
